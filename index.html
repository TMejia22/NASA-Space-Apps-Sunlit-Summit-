<section class="factor"><h2>Site Sector</section>
<section class="factor"><h2>Connecting ridge</h2></section>
<section class="factor"><h2>Shackleton rim</h2></section>
<section class="factor"><h2>Peak near Shackleton</h2></section>

<section class="factor"><h2>Malapert massif</h2></section>


<!-- Dark map area -->
  <div class="viewport">
    <canvas id="map"></canvas>

    <svg class="crosshair" width="44" height="44" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="10" fill="none" stroke="#ff5a36" stroke-width="3"/>
      <path d="M22 0v44M0 22h44" stroke="#ff5a36" stroke-width="3"/>
    </svg>

    <div class="legend">
      <div class="legend-labels"><span>Less suitable</span><span>More suitable</span></div>
      <div class="legend-bar"></div>
    </div>
  </div>
</body>
</html>

<script>
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(canvas.width, canvas.height);

  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      // Fake score 0-1; replace with your real grid values
      const s = (Math.sin(x / 20) + Math.cos(y / 15) + 2) / 4;
      const i = (y * canvas.width + x) * 4;
      img.data[i]     = 30 + 200 * s;   // R
      img.data[i + 1] = 40 + 190 * s;   // G
      img.data[i + 2] = 120 - 80 * s;   // B
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - r.left) / r.width * canvas.width);
    const row = Math.floor((e.clientY - r.top) / r.height * canvas.height);
    console.log("Column " + col + ", row " + row);
  });
</script>
